<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body {
      font-family: Arial, sans-serif;
      color: #1f2937;
      margin: 0;
      padding: 18px;
      background: #f8fafc;
    }
    h2 {
      margin: 0 0 14px;
      color: #0f766e;
    }
    .card {
      background: white;
      border: 1px solid #dbe4e8;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 14px;
    }
    .meta {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      font-size: 12px;
    }
    .meta div {
      background: #f1f5f9;
      padding: 8px;
      border-radius: 6px;
    }
    .trecho {
      max-height: 190px;
      overflow-y: auto;
      white-space: pre-wrap;
      line-height: 1.4;
      font-size: 13px;
    }
    label {
      display: block;
      margin-top: 12px;
      margin-bottom: 5px;
      font-weight: bold;
      font-size: 13px;
    }
    select, input, textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 9px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      background: white;
    }
    textarea {
      min-height: 90px;
      resize: vertical;
    }
    button {
      width: 100%;
      margin-top: 16px;
      padding: 11px;
      background: #0f766e;
      color: white;
      border: 0;
      border-radius: 7px;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled {
      opacity: .6;
      cursor: wait;
    }
    .status {
      margin-top: 12px;
      padding: 10px;
      border-radius: 6px;
      display: none;
    }
    .ok { background: #d1fae5; }
    .erro { background: #fecaca; }
  </style>
</head>
<body>
  <h2>Reportar ajuste</h2>

  <div class="card">
    <div class="meta">
      <div><strong>ID</strong><br><span id="id"></span></div>
      <div><strong>Habilidade</strong><br><span id="habilidade"></span></div>
      <div><strong>Ano/Edição</strong><br><span id="edicao"></span></div>
      <div><strong>Dificuldade</strong><br><span id="dificuldade"></span></div>
    </div>

    <label>Objeto atual</label>
    <div id="objeto"></div>

    <label>Trecho inicial</label>
    <div class="trecho" id="trecho"></div>
  </div>

  <form id="form">
    <input type="hidden" name="idQuestao" value="<?= idQuestao ?>">

    <label for="tipoProblema">Tipo de problema</label>
    <select id="tipoProblema" name="tipoProblema" required>
      <option value="">Selecione</option>
      <option>Componente</option>
      <option>Habilidade</option>
      <option>Objeto de conhecimento</option>
      <option>Ação cognitiva</option>
      <option>Dificuldade</option>
      <option>Função pedagógica</option>
      <option>Tempo estimado</option>
      <option>Duplicidade</option>
      <option>Trecho insuficiente</option>
      <option>Erro no item</option>
      <option>Outro</option>
    </select>

    <label for="campoContestado">Campo contestado</label>
    <select id="campoContestado" name="campoContestado" required>
      <option value="">Selecione</option>
      <option value="componente_principal">componente_principal</option>
      <option value="habilidade">habilidade</option>
      <option value="objeto_principal">objeto_principal</option>
      <option value="objeto_id">objeto_id</option>
      <option value="acao_cognitiva_especifica">acao_cognitiva_especifica</option>
      <option value="dificuldade_faixa">dificuldade_faixa</option>
      <option value="dificuldade_rotulo">dificuldade_rotulo</option>
      <option value="funcao_pedagogica_sugerida">funcao_pedagogica_sugerida</option>
      <option value="tempo_estimado_min">tempo_estimado_min</option>
      <option value="trecho_inicial">trecho_inicial</option>
      <option value="status_item">status_item</option>
    </select>

    <label for="valorSugerido">Valor sugerido</label>
    <input id="valorSugerido" name="valorSugerido" type="text">

    <label for="prioridade">Prioridade</label>
    <select id="prioridade" name="prioridade">
      <option>Normal</option>
      <option>Baixa</option>
      <option>Alta</option>
      <option>Crítica</option>
    </select>

    <label for="justificativa">Justificativa</label>
    <textarea id="justificativa" name="justificativa" required></textarea>

    <button id="enviar" type="submit">Registrar reporte</button>
  </form>

  <div id="status" class="status"></div>

  <script>
    const idQuestao = '<?= idQuestao ?>';

    function mostrarStatus(texto, classe) {
      const el = document.getElementById('status');
      el.textContent = texto;
      el.className = 'status ' + classe;
      el.style.display = 'block';
    }

    google.script.run
      .withSuccessHandler(dados => {
        document.getElementById('id').textContent = dados.id || '';
        document.getElementById('habilidade').textContent = dados.habilidade || '';
        document.getElementById('edicao').textContent =
          `${dados.ano || ''} / ${dados.edicao || ''}`;
        document.getElementById('dificuldade').textContent = dados.dificuldade || '';
        document.getElementById('objeto').textContent = dados.objeto || '';
        document.getElementById('trecho').textContent = dados.trecho || '';
      })
      .withFailureHandler(err => mostrarStatus(err.message, 'erro'))
      .obterDadosQuestaoParaReporte(idQuestao);

    document.getElementById('form').addEventListener('submit', event => {
      event.preventDefault();

      const botao = document.getElementById('enviar');
      botao.disabled = true;
      botao.textContent = 'Registrando...';

      const form = Object.fromEntries(new FormData(event.target).entries());

      google.script.run
        .withSuccessHandler(msg => {
          mostrarStatus(msg, 'ok');
          botao.textContent = 'Reporte registrado';
          setTimeout(() => google.script.host.close(), 1200);
        })
        .withFailureHandler(err => {
          mostrarStatus(err.message, 'erro');
          botao.disabled = false;
          botao.textContent = 'Registrar reporte';
        })
        .registrarReporteSidebar(form);
    });
  </script>
</body>
</html>
